<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber AI Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Consolas, monospace;
    background:black;
    color:#00ff88;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    padding:15px;
    text-align:center;
    background:#001a0d;
    font-size:20px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.msg{
    margin:10px 0;
}

.user{color:#00ffff;}
.ai{color:#00ff88;}

.input-box{
    display:flex;
    border-top:2px solid #00ff88;
}

input{
    flex:1;
    padding:15px;
    border:none;
    outline:none;
    background:black;
    color:#00ff88;
    font-size:16px;
}

button{
    width:120px;
    background:#00ff88;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
button:hover{
    background:#00cc66;
}
</style>
</head>

<body>

<header>CYBER AI CHATBOT 🤖</header>

<div id="chat"></div>

<div class="input-box">
    <input id="text" placeholder="Ask something...">
    <button onclick="send()">SEND</button>
</div>

<script>

const chat = document.getElementById("chat");

async function send(){

    const input = document.getElementById("text");
    const text = input.value.trim();

    if(!text) return;

    // user message
    chat.innerHTML += `<div class="msg user">YOU: ${text}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    // loading
    chat.innerHTML += `<div class="msg ai">AI: thinking...</div>`;

    try{

        const res = await fetch("/api/chat", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        // remove last loading message
        document.querySelectorAll(".msg.ai").forEach((el, i)=>{
            if(i === document.querySelectorAll(".msg.ai").length - 1){
                el.remove();
            }
        });

        chat.innerHTML += `<div class="msg ai">AI: ${data.reply}</div>`;
        chat.scrollTop = chat.scrollHeight;

    } catch(err){

        chat.innerHTML += `<div class="msg ai">ERROR CONNECTING ⚠️</div>`;
        console.log(err);
    }
}

</script>

</body>
</html>
