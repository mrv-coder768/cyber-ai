<body>

<!-- LOGIN PAGE -->

<div id="loginPage" style="
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:black;
flex-direction:column;
">

    <div style="
    width:320px;
    padding:30px;
    border:2px solid #00ff88;
    box-shadow:0 0 20px #00ff88;
    background:#000;
    border-radius:10px;
    ">

        <h1 style="
        text-align:center;
        margin-bottom:20px;
        color:#00ff88;
        ">
        CYBER LOGIN
        </h1>

        <input
        id="username"
        placeholder="Username"
        style="
        width:100%;
        padding:12px;
        margin-bottom:15px;
        background:black;
        border:1px solid #00ff88;
        color:#00ff88;
        ">

        <input
        type="password"
        id="password"
        placeholder="Password"
        style="
        width:100%;
        padding:12px;
        margin-bottom:15px;
        background:black;
        border:1px solid #00ff88;
        color:#00ff88;
        ">

        <button onclick="login()" style="
        width:100%;
        padding:12px;
        background:#00ff88;
        border:none;
        font-weight:bold;
        cursor:pointer;
        ">
        LOGIN
        </button>

        <div id="error" style="
        color:red;
        margin-top:10px;
        text-align:center;
        ">
        </div>

    </div>

</div>

<!-- CHAT PAGE -->

<div id="chatPage" style="display:none; height:100vh; flex-direction:column;">

<header style="
padding:15px;
text-align:center;
background:#001a0d;
font-size:22px;
color:#00ff88;
border-bottom:2px solid #00ff88;
">
CYBER BTS AI 💜
</header>

<div id="chat" style="
flex:1;
overflow-y:auto;
padding:15px;
background:black;
color:#00ff88;
font-family:Consolas, monospace;
">

<div class="msg ai">
AI: Hi Nirmala 💜<br>
Ready to talk about BTS, music, life, coding, studies and everything in between 😎
</div>

</div>

<div style="
display:flex;
border-top:2px solid #00ff88;
">

<input
id="text"
placeholder="Ask anything..."
style="
flex:1;
padding:16px;
background:black;
border:none;
outline:none;
color:#00ff88;
font-size:16px;
">

<button onclick="send()" style="
width:120px;
background:#00ff88;
border:none;
font-weight:bold;
cursor:pointer;
">
SEND
</button>

</div>

</div>

<script>

function login(){

    const user =
    document.getElementById("username").value;

    const pass =
    document.getElementById("password").value;

    if(user === "applepie" &&
       pass === "nirmala"){

        document
        .getElementById("loginPage")
        .style.display = "none";

        document
        .getElementById("chatPage")
        .style.display = "flex";
    }

    else{

        document
        .getElementById("error")
        .innerHTML = "Wrong Username or Password";
    }
}

const chat =
document.getElementById("chat");

async function send(){

    const input =
    document.getElementById("text");

    const text =
    input.value.trim();

    if(!text) return;

    chat.innerHTML += `
    <div class="msg user" style="color:#00ffff; margin:10px 0;">
    YOU: ${text}
    </div>
    `;

    input.value = "";

    chat.innerHTML += `
    <div class="msg ai" id="loading" style="margin:10px 0;">
    AI: Thinking...
    </div>
    `;

    chat.scrollTop =
    chat.scrollHeight;

    try{

        const res = await fetch("/api/chat", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                message:text
            })
        });

        const data =
        await res.json();

        document
        .getElementById("loading")
        .remove();

        chat.innerHTML += `
        <div class="msg ai" style="margin:10px 0;">
        AI: ${data.reply}
        </div>
        `;

        chat.scrollTop =
        chat.scrollHeight;

    }

    catch(err){

        document
        .getElementById("loading")
        .remove();

        chat.innerHTML += `
        <div class="msg ai">
        ERROR CONNECTING ⚠️
        </div>
        `;
    }
}

document
.getElementById("text")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){
        send();
    }

});

</script>

</body>
