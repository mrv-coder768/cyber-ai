<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER BTS AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    color:#00ff88;
    font-family:Consolas, monospace;
    height:100vh;
    overflow:hidden;
}

/* LOGIN PAGE */

#loginPage{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
}

.login-box{
    width:90%;
    max-width:350px;
    padding:30px;
    border:2px solid #00ff88;
    box-shadow:0 0 20px #00ff88;
    border-radius:10px;
    background:#000;
}

.login-box h1{
    text-align:center;
    margin-bottom:20px;
    color:#00ff88;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    background:black;
    border:1px solid #00ff88;
    color:#00ff88;
    outline:none;
    border-radius:8px;
    font-size:16px;
}

.login-box button{
    width:100%;
    padding:14px;
    background:#00ff88;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
}

.login-box button:hover{
    background:#00cc66;
}

#error{
    color:red;
    margin-top:10px;
    text-align:center;
}

/* CHAT PAGE */

#chatPage{
    display:none;
    flex-direction:column;
    height:100vh;
}

header{
    padding:15px;
    text-align:center;
    background:#001a0d;
    border-bottom:2px solid #00ff88;
    font-size:22px;
    flex-shrink:0;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    padding-bottom:110px;
    word-wrap:break-word;
}

.msg{
    margin:12px 0;
    line-height:1.6;
    font-size:15px;
}

.user{
    color:#00ffff;
}

.ai{
    color:#00ff88;
}

/* INPUT AREA */

.input-box{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
    gap:8px;
    background:black;
    border-top:2px solid #00ff88;
    padding:10px;
}

#text{
    flex:1;
    padding:14px;
    background:black;
    border:1px solid #00ff88;
    color:#00ff88;
    outline:none;
    border-radius:8px;
    font-size:16px;
}

.send-btn{
    width:90px;
    background:#00ff88;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
}

.send-btn:hover{
    background:#00cc66;
}

/* MOBILE */

@media(max-width:600px){

    header{
        font-size:18px;
        padding:12px;
    }

    .msg{
        font-size:14px;
    }

    #text{
        font-size:15px;
        padding:12px;
    }

    .send-btn{
        width:70px;
        font-size:14px;
    }
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#00ff88;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

    <div class="login-box">

        <h1>CYBER LOGIN</h1>

        <input
        type="text"
        id="username"
        placeholder="Username">

        <input
        type="password"
        id="password"
        placeholder="Password">

        <button onclick="login()">
            LOGIN
        </button>

        <div id="error"></div>

    </div>

</div>

<!-- CHAT PAGE -->

<div id="chatPage">

<header>
CYBER BTS AI 💜
</header>

<div id="chat">

<div class="msg ai">
AI: Welcome to CYBER BTS AI 😎💜<br><br>
Ask me anything about BTS, music, coding, movies, studies, games, life and more ✨
</div>

</div>

<div class="input-box">

<input
type="text"
id="text"
placeholder="Ask anything...">

<button
class="send-btn"
onclick="send()">
SEND
</button>

<button
class="send-btn"
onclick="startVoice()">
🎤
</button>

</div>

</div>

<script>

/* LOGIN */

function login(){

    const user =
    document.getElementById("username").value;

    const pass =
    document.getElementById("password").value;

    if(user === "usernameot7" &&
       pass === "nirmala"){

        document
        .getElementById("loginPage")
        .style.display = "none";

        document
        .getElementById("chatPage")
        .style.display = "flex";

        document
        .getElementById("chat")
        .innerHTML = `
        <div class="msg ai">
        AI: Hey ${user} 💜<br><br>
        Welcome to CYBER BTS AI 😎<br>
        Ready to talk about BTS, music, coding, studies, movies and life ✨
        </div>
        `;
    }

    else{

        document
        .getElementById("error")
        .innerHTML =
        "Wrong Username or Password ⚠️";
    }
}

/* CHAT */

const chat =
document.getElementById("chat");

async function send(){

    const input =
    document.getElementById("text");

    const text =
    input.value.trim();

    if(!text) return;

    /* USER MESSAGE */

    chat.innerHTML += `
    <div class="msg user">
    YOU: ${text}
    </div>
    `;

    input.value = "";

    /* LOADING */

    chat.innerHTML += `
    <div class="msg ai" id="loading">
    AI: Thinking...
    </div>
    `;

    chat.scrollTop =
    chat.scrollHeight;

    try{

        const res = await fetch("/api/chat", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })

        });

        const data =
        await res.json();

        document
        .getElementById("loading")
        .remove();

        chat.innerHTML += `
        <div class="msg ai">
        AI: ${data.reply}
        </div>
        `;

        chat.scrollTop =
        chat.scrollHeight;

    }

    catch(err){

        document
        .getElementById("loading")
        .remove();

        chat.innerHTML += `
        <div class="msg ai">
        ERROR CONNECTING ⚠️
        </div>
        `;

        console.log(err);
    }
}

/* ENTER KEY */

document
.getElementById("text")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){
        send();
    }

});

/* VOICE INPUT */

function startVoice(){

    const recognition =
    new(window.SpeechRecognition ||
         window.webkitSpeechRecognition)();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event){

        const transcript =
        event.results[0][0].transcript;

        document
        .getElementById("text")
        .value = transcript;

        send();
    };

    recognition.onerror = function(event){

        alert(
        "Voice error: " +
        event.error
        );
    };
}

</script>

</body>
</html>
