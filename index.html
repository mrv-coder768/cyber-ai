<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTS UNIVERSE AI 💜</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:Consolas, monospace;
    color:#d291ff;
    height:100vh;
}

/* MATRIX */

#matrix{
    position:fixed;
    top:0;
    left:0;
    z-index:-2;
}

/* INTRO SCREEN */

#universeIntro{
    position:fixed;
    width:100%;
    height:100vh;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;
    z-index:9999;
}

.stars{
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(#d291ff 1px, transparent 1px);

    background-size:50px 50px;

    animation:moveStars 20s linear infinite;

    opacity:0.5;
}

@keyframes moveStars{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-500px);
    }
}

/* PORTAL */

.portal{

    width:180px;
    height:180px;

    border-radius:50%;

    border:8px solid #d291ff;

    box-shadow:
    0 0 20px #d291ff,
    0 0 60px #d291ff,
    0 0 120px #d291ff,
    0 0 200px #d291ff;

    animation:
    portalSpin 5s linear infinite,
    portalPulse 2s infinite;
}

@keyframes portalSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes portalPulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
    }
}

/* TEXT */

.intro-text{

    margin-top:50px;

    font-size:36px;

    text-align:center;

    color:#d291ff;

    text-shadow:
    0 0 10px #d291ff,
    0 0 30px #d291ff,
    0 0 60px #d291ff;

    animation:textGlow 1s infinite alternate;
}

@keyframes textGlow{

    from{
        opacity:0.5;
    }

    to{
        opacity:1;
    }
}

/* LOGIN PAGE */

#loginPage{

    width:100%;
    height:100vh;

    display:none;

    justify-content:center;
    align-items:center;
}

.login-box{

    width:90%;
    max-width:350px;

    padding:30px;

    border:2px solid #d291ff;

    border-radius:15px;

    background:rgba(0,0,0,0.8);

    box-shadow:
    0 0 20px #d291ff,
    0 0 60px #d291ff;
}

.login-box h1{

    text-align:center;

    margin-bottom:20px;

    color:#d291ff;
}

.login-box input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    background:black;

    border:1px solid #d291ff;

    color:#d291ff;

    border-radius:10px;

    outline:none;
}

.login-box button{

    width:100%;

    padding:14px;

    border:none;

    background:#d291ff;

    color:black;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;
}

#error{

    color:red;

    margin-top:10px;

    text-align:center;
}

/* CHAT PAGE */

#chatPage{

    display:none;

    flex-direction:column;

    height:100vh;
}

header{

    padding:15px;

    text-align:center;

    background:#1a001f;

    border-bottom:2px solid #d291ff;

    font-size:22px;

    color:#d291ff;
}

#chat{

    flex:1;

    overflow-y:auto;

    padding:15px;

    padding-bottom:120px;
}

.msg{

    margin:12px 0;

    line-height:1.6;
}

.user{
    color:#66ffff;
}

.ai{
    color:#d291ff;
}

/* INPUT */

.input-box{

    position:fixed;

    bottom:0;

    width:100%;

    display:flex;

    gap:8px;

    padding:10px;

    background:black;

    border-top:2px solid #d291ff;
}

#text{

    flex:1;

    padding:14px;

    background:black;

    border:1px solid #d291ff;

    color:#d291ff;

    border-radius:10px;

    outline:none;
}

.send-btn{

    width:70px;

    border:none;

    background:#d291ff;

    color:black;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;
}

@media(max-width:600px){

    .intro-text{
        font-size:26px;
    }

    .portal{
        width:130px;
        height:130px;
    }

    .send-btn{
        width:60px;
        font-size:12px;
    }
}

</style>
</head>

<body>

<!-- INTRO MUSIC -->

<audio id="introMusic">
    <source src="./bgm1.mp3" type="audio/mpeg">
</audio>

<!-- CHAT MUSIC -->

<audio id="chatMusic" loop>
    <source src="./bgm.mp3" type="audio/mpeg">
</audio>

<!-- MATRIX -->

<canvas id="matrix"></canvas>

<!-- INTRO -->

<div id="universeIntro">

    <div class="stars"></div>

    <div class="portal"></div>

    <h1 class="intro-text">
        ENTERING BTS UNIVERSE 💜
    </h1>

</div>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-box">

        <h1>BTS LOGIN 💜</h1>

        <input
        type="text"
        id="username"
        placeholder="Username">

        <input
        type="password"
        id="password"
        placeholder="Password = username + ot7">

        <button onclick="login()">
        ENTER
        </button>

        <div id="error"></div>

    </div>

</div>

<!-- CHAT -->

<div id="chatPage">

<header>
BTS UNIVERSE AI 💜
</header>

<div id="chat">

<div class="msg ai">
💜 Welcome to BTS Universe AI ✨
</div>

</div>

<div class="input-box">

<input
type="text"
id="text"
placeholder="Ask anything...">

<button
class="send-btn"
onclick="send()">
SEND
</button>

</div>

</div>

<script>

/* PLAY INTRO MUSIC */

const introMusic =
document.getElementById("introMusic");

introMusic.volume = 0.6;

introMusic.play();

/* AFTER 8 SECONDS */

setTimeout(() => {

    /* STOP INTRO MUSIC */

    introMusic.pause();

    introMusic.currentTime = 0;

    /* HIDE INTRO */

    document
    .getElementById("universeIntro")
    .style.display = "none";

    /* SHOW LOGIN PAGE */

    document
    .getElementById("loginPage")
    .style.display = "flex";

},8000);

/* LOGIN */

function login(){

    const user =
    document.getElementById("username").value.trim();

    const pass =
    document.getElementById("password").value.trim();

    if(pass === user + "ot7"){

        /* START CHAT MUSIC */

        const chatMusic =
        document.getElementById("chatMusic");

        chatMusic.volume = 0.5;

        chatMusic.play();

        /* OPEN CHAT */

        document
        .getElementById("loginPage")
        .style.display = "none";

        document
        .getElementById("chatPage")
        .style.display = "flex";

        document
        .getElementById("chat")
        .innerHTML += `
        <div class="msg ai">
        💜 Welcome ${user}<br>
        You entered BTS Universe ⚡
        </div>
        `;
    }

    else{

        document
        .getElementById("error")
        .innerHTML =
        "Password must be username + ot7";
    }
}

/* CHAT */

const chat =
document.getElementById("chat");

async function send(){

    const input =
    document.getElementById("text");

    const text =
    input.value.trim();

    if(!text) return;

    chat.innerHTML += `
    <div class="msg user">
    YOU: ${text}
    </div>
    `;

    input.value = "";

    chat.innerHTML += `
    <div class="msg ai" id="loading">
    AI: Thinking...
    </div>
    `;

    chat.scrollTop =
    chat.scrollHeight;

    try{

        const res =
        await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })
        });

        const data =
        await res.json();

        document
        .getElementById("loading")
        .remove();

        chat.innerHTML += `
        <div class="msg ai">
        AI: ${data.reply}
        </div>
        `;

        const speech =
        new SpeechSynthesisUtterance(
        data.reply
        );

        speech.rate = 1;

        speech.pitch = 1;

        speech.volume = 1;

        speechSynthesis.speak(speech);

        chat.scrollTop =
        chat.scrollHeight;

    }

    catch(err){

        document
        .getElementById("loading")
        .remove();

        chat.innerHTML += `
        <div class="msg ai">
        ERROR CONNECTING ⚠️
        </div>
        `;
    }
}

/* ENTER KEY */

document
.getElementById("text")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){
        send();
    }
});

/* MATRIX EFFECT */

const canvas =
document.getElementById("matrix");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const letters =
"💜BTS01";

const fontSize = 14;

const columns =
canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++){
    drops[i]=1;
}

function draw(){

    ctx.fillStyle =
    "rgba(0,0,0,0.05)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
    "#d291ff";

    ctx.font =
    fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){

        const text =
        letters[
        Math.floor(
        Math.random()*letters.length
        )];

        ctx.fillText(
            text,
            i*fontSize,
            drops[i]*fontSize
        );

        if(
        drops[i]*fontSize >
        canvas.height &&
        Math.random()>0.975
        ){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(draw,35);

</script>

</body>
</html>
