<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER BTS AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    color:#00ff88;
    font-family:Consolas, monospace;
    height:100vh;
    overflow:hidden;
}

/* MATRIX */

#matrix{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

/* LOADER */

#loader{
    position:fixed;
    width:100%;
    height:100vh;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#00ff88;
    font-size:22px;
    z-index:9999;
    animation:fadeOut 3s forwards;
}

@keyframes fadeOut{

    0%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    100%{
        opacity:0;
        visibility:hidden;
    }
}

/* LOGIN */

#loginPage{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:90%;
    max-width:350px;
    padding:30px;
    border:2px solid #00ff88;
    border-radius:10px;
    background:black;
    box-shadow:0 0 20px #00ff88;
}

.login-box h1{
    text-align:center;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    background:black;
    border:1px solid #00ff88;
    color:#00ff88;
    border-radius:8px;
    outline:none;
}

.login-box button{
    width:100%;
    padding:14px;
    background:#00ff88;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

#error{
    color:red;
    text-align:center;
    margin-top:10px;
}

/* CHAT */

#chatPage{
    display:none;
    flex-direction:column;
    height:100vh;
}

header{
    padding:15px;
    text-align:center;
    background:#001a0d;
    border-bottom:2px solid #00ff88;
    font-size:22px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    padding-bottom:120px;
}

.msg{
    margin:12px 0;
    line-height:1.6;
}

.user{
    color:#00ffff;
}

.ai{
    color:#00ff88;
}

/* INPUT */

.input-box{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    gap:8px;
    padding:10px;
    background:black;
    border-top:2px solid #00ff88;
}

#text{
    flex:1;
    padding:14px;
    background:black;
    border:1px solid #00ff88;
    color:#00ff88;
    border-radius:8px;
    outline:none;
}

.send-btn{
    width:70px;
    border:none;
    background:#00ff88;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:600px){

    header{
        font-size:18px;
    }

    .send-btn{
        width:60px;
        font-size:12px;
    }

    #text{
        font-size:15px;
    }
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#00ff88;
}

</style>
</head>

<body>

<!-- MUSIC -->

<audio id="bgm" loop>
    <source src="./bgm.mp3" type="audio/mpeg">
</audio>

<!-- MATRIX -->

<canvas id="matrix"></canvas>

<!-- LOADER -->

<div id="loader">
⚡ CONNECTING TO BTS CYBER NETWORK ⚡
</div>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-box">

        <h1>CYBER LOGIN 💜</h1>

        <input
        type="text"
        id="username"
        placeholder="Username">

        <input
        type="password"
        id="password"
        placeholder="Password = username + ot7">

        <button onclick="login()">
        LOGIN
        </button>

        <div id="error"></div>

    </div>

</div>

<!-- CHAT -->

<div id="chatPage">

<header>
CYBER BTS AI 💜
</header>

<div id="chat">

<div class="msg ai">
⚡ Welcome to CYBER BTS AI 😎💜<br><br>
Talk about BTS, Instagram, coding, music, studies and life ✨
</div>

</div>

<div class="input-box">

<input
type="text"
id="text"
placeholder="Ask anything or type @username">

<button
class="send-btn"
onclick="send()">
SEND
</button>

<button
class="send-btn"
onclick="startVoice()">
🎤
</button>

<button
class="send-btn"
onclick="scanProfile()">
SCAN
</button>

</div>

</div>

<script>

/* LOGIN */

function login(){

    const user =
    document.getElementById("username").value.trim();

    const pass =
    document.getElementById("password").value.trim();

    if(pass === user + "ot7"){

        /* PLAY MUSIC */

        const music =
        document.getElementById("bgm");

        music.volume = 0.5;

        music.play();

        /* OPEN CHAT */

        document
        .getElementById("loginPage")
        .style.display = "none";

        document
        .getElementById("chatPage")
        .style.display = "flex";

        document
        .getElementById("chat")
        .innerHTML += `
        <div class="msg ai">
        💜 Welcome ${user}<br>
        BTS Cyber Network Connected ⚡
        </div>
        `;
    }

    else{

        document
        .getElementById("error")
        .innerHTML =
        "Password must be username + ot7";
    }
}

/* CHAT */

const chat =
document.getElementById("chat");

async function send(){

    const input =
    document.getElementById("text");

    const text =
    input.value.trim();

    if(!text) return;

    chat.innerHTML += `
    <div class="msg user">
    YOU: ${text}
    </div>
    `;

    input.value = "";

    chat.innerHTML += `
    <div class="msg ai" id="loading">
    AI: Thinking...
    </div>
    `;

    chat.scrollTop =
    chat.scrollHeight;

    try{

        const res =
        await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })
        });

        const data =
        await res.json();

        document
        .getElementById("loading")
        .remove();

        chat.innerHTML += `
        <div class="msg ai">
        AI: ${data.reply}
        </div>
        `;

        /* AI VOICE */

        const speech =
        new SpeechSynthesisUtterance(
        data.reply
        );

        speech.lang = "en-US";

        window
        .speechSynthesis
        .speak(speech);

        /* RANDOM BTS MESSAGE */

        const btsMessages = [

        "📩 Jungkook: drink water 💜",

        "📩 Taehyung: don't skip meals 🌌",

        "📩 RM: keep chasing your dreams ⚡",

        "📩 Jimin: you're amazing 💜"

        ];

        chat.innerHTML += `
        <div class="msg ai">
        ${
        btsMessages[
        Math.floor(
        Math.random()*btsMessages.length
        )]
        }
        </div>
        `;

        chat.scrollTop =
        chat.scrollHeight;

    }

    catch(err){

        document
        .getElementById("loading")
        .remove();

        chat.innerHTML += `
        <div class="msg ai">
        ERROR CONNECTING ⚠️
        </div>
        `;
    }
}

/* ENTER KEY */

document
.getElementById("text")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){
        send();
    }
});

/* VOICE INPUT */

function startVoice(){

    const recognition =
    new(window.SpeechRecognition ||
         window.webkitSpeechRecognition)();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult =
    function(event){

        const transcript =
        event.results[0][0].transcript;

        document
        .getElementById("text")
        .value = transcript;

        send();
    };
}

/* INSTAGRAM SCAN */

function scanProfile(){

    const input =
    document.getElementById("text").value;

    if(input.startsWith("@")){

        const energy =
        Math.floor(Math.random()*20)+80;

        const members = [
        "Jungkook",
        "Taehyung",
        "Jimin",
        "RM",
        "Suga",
        "Jin",
        "J-Hope"
        ];

        const randomMember =
        members[
        Math.floor(
        Math.random()*members.length
        )];

        chat.innerHTML += `
        <div class="msg ai">

        ⚡ SCANNING INSTAGRAM PROFILE...<br><br>

        📸 PROFILE: ${input}<br><br>

        💜 ARMY ENERGY:
        ${energy}%<br><br>

        ✨ BTS MEMBER MATCH:
        ${randomMember}<br><br>

        🌌 VIBE:
        emotional midnight ARMY 😭💜

        </div>
        `;

        chat.scrollTop =
        chat.scrollHeight;
    }

    else{

        alert(
        "Type Instagram username starting with @"
        );
    }
}

/* MATRIX EFFECT */

const canvas =
document.getElementById("matrix");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const letters =
"01BTS💜⚡";

const fontSize = 14;

const columns =
canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++){
    drops[i]=1;
}

function draw(){

    ctx.fillStyle =
    "rgba(0,0,0,0.05)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
    "#00ff88";

    ctx.font =
    fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){

        const text =
        letters[Math.floor(
        Math.random()*letters.length
        )];

        ctx.fillText(
            text,
            i*fontSize,
            drops[i]*fontSize
        );

        if(
        drops[i]*fontSize >
        canvas.height &&
        Math.random()>0.975
        ){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(draw,35);

</script>

</body>
</html>
